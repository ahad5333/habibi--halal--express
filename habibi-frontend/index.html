<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Habibi Halal Express — Fresh, authentic halal platters, gyros, burgers and more. Fast delivery across the Bronx, NY." />
    <meta name="keywords" content="halal food bronx, halal delivery bronx, mediterranean food, halal platters, gyros, shawarma, halal burgers, habibi halal, bronx food delivery" />
    <meta name="author" content="Habibi Halal Express" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://habibihe.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type"        content="restaurant.restaurant" />
    <meta property="og:url"         content="https://habibihe.com/" />
    <meta property="og:site_name"   content="Habibi Halal Express" />
    <meta property="og:locale"      content="en_US" />
    <meta property="og:title"       content="Habibi Halal Express | Authentic Halal Street Food · Bronx, NY" />
    <meta property="og:description" content="Fresh halal platters, gyros, shawarma & burgers made to order. Fast delivery + pickup across the Bronx. Order online now!" />
    <meta property="og:image"       content="https://habibihe.com/favicon.png" />
    <meta property="og:image:width"  content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt"    content="Habibi Halal Express logo" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Habibi Halal Express | Authentic Halal Street Food · Bronx, NY" />
    <meta name="twitter:description" content="Fresh halal platters, gyros, shawarma & burgers made to order. Fast delivery + pickup across the Bronx." />
    <meta name="twitter:image"       content="https://habibihe.com/favicon.png" />
    <!-- Tab icon: the rooster's head on a black circle, filling the whole
         square. The full logo (ring, rocket, both lines of text) shrank to an
         unreadable speck at tab size. favicon.png is deliberately left alone:
         it's also the social-share image and the push-notification icon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <!-- iOS ignores the web manifest, so the install appearance comes from
         these three tags. Previously pointed at the 500x500 favicon, which
         iOS downscaled on every home-screen add. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Habibi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
    <title>Habibi Halal Express | Authentic Mediterranean Street Food</title>

    <!-- JSON-LD fallback for crawlers that don't run JavaScript: only details
         that can't go stale. Each page replaces it (SEO.jsx, same id) with the
         full version built from CPanel -- phone, opening hours, the 3 stores,
         payment methods (utils/businessSchema.js). The old hand-typed copy here
         said 10 AM-10 PM, listed cash, and gave the 888 number. -->
    <script id="json-ld-schema" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "@id": "https://habibihe.com/#restaurant",
      "name": "Habibi Halal Express",
      "url": "https://habibihe.com",
      "logo": "https://habibihe.com/images/logos/logo-badge.webp",
      "image": "https://habibihe.com/favicon.png",
      "description": "Fresh, authentic halal platters, gyros, shawarma and burgers made to order. Delivery and pickup in the Bronx, NY.",
      "servesCuisine": ["Halal", "Mediterranean", "Middle Eastern", "Platters", "Gyros", "Burgers"],
      "priceRange": "$$",
      "hasMenu": "https://habibihe.com/menu",
      "acceptsReservations": false,
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Bronx",
        "addressRegion": "NY",
        "addressCountry": "US"
      }
    }
    </script>
  </head>
  <body>
    <!-- Meta Pixel noscript fallback -->
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1557439275935025&ev=PageView&noscript=1" /></noscript>
    <div id="root"></div>
    <noscript>
      <div style="font-family:sans-serif;text-align:center;padding:3rem;">
        <h2>Habibi Halal Express</h2>
        <p>Please enable JavaScript to use this site, or <a href="tel:+19290000000">call us</a> to place an order.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
