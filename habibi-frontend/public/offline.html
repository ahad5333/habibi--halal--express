<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Habibi Halal Express</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background:
      radial-gradient(1100px 620px at 50% -12%, rgba(229, 182, 78, 0.10), transparent 60%),
      #0a0a0a;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #f1f1f1;
    text-align: center;
  }
  .card {
    max-width: 380px;
    width: 100%;
    background: #121212;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 22px;
    padding: 2.25rem 1.75rem;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  }
  img { width: 64px; height: 64px; object-fit: contain; margin-bottom: 1rem; }
  h1 { font-size: 1.3rem; font-weight: 800; color: #E5B64E; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
  p  { font-size: 0.9rem; line-height: 1.6; color: rgba(255, 255, 255, 0.6); margin: 0 0 1.5rem; }
  button {
    width: 100%;
    font: inherit;
    font-weight: 800;
    background: linear-gradient(180deg, #E5B64E, #cf9f37);
    color: #17130a;
    border: none;
    border-radius: 12px;
    padding: 0.85rem;
    cursor: pointer;
  }
  button:active { transform: scale(0.99); }
  .hint { font-size: 0.75rem; color: rgba(255,255,255,0.32); margin: 1.15rem 0 0; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="" onerror="this.style.display='none'">
    <h1>You're offline</h1>
    <p>We can't reach Habibi Halal Express right now. Check your connection and try again — any order you've already placed is safe.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="hint">Already ordered? Your confirmation email and SMS have your order number.</p>
  </div>
</body>
</html>
